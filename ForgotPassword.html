<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <h1>Reset Password</h1>

        <main>
            <label for="resetEmail">
                Enter your email <span class="required">*</span>
            </label>

            <input type="email"
                   id="resetEmail"
                   placeholder="Email"
                   required />

            <button class="primary-butoon" onclick="sendResetEmail()">
                Send Reset Email
            </button>

            <p id="resetMessage"></p>

            <button class="secondary-butoon" onclick="goToLogin()">
                Back to Login
            </button>

        </main>

    </div>

    <script src="JavaScript.js"></script>

</body>
</html>
