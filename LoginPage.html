<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style1.css">
    <script src="JavaScript.js" defer></script>
</head>

<body>

    <div class="app">
        <h1>Welcome to Cybertrak! </h1>
        <main>
            <h2> Login</h2>
            <label for="email">
                Email<span class="required">*</span>
            </label>
            <input type="email" id="email" required />

            <label for="password">
                Password <span class="required">*</span>
            </label>
            <input type="password" id="password" required />

            <button onclick="login()" class="primary-button">
                Login
            </button>

            <button onclick="forgotPassword()" class="secondary-button">
                Forgot Password?
            </button>

            <button onclick="goToCreateAccount()" class="secondary-button">
                Create Account
            </button>

        </main>

    </div>


</body>
</html>
