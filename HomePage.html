<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>My App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style1.css">
    <!--Leaflet css-->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

</head>

<body>
    <div class="app">

        <div id="popup" class="popup">
            <div class="popup-content">
                <h3>Would you like to share your location?</h3>
                <button onclick="shareLocation()">Allow</button>
                <button onclick="closePopup()">Don't allow</button>
            </div>
        </div>

        <!--top navigation-->
        <div class="top-bar">
            <header class="top-bar-header">
                <h2>Cybertrak</h2>
            </header>
            <div class="top-buttons">
                <div class="search-container" id="searchContainer">
                    <button id="searchButton" type="button" onclick="openSearch()">
                        <img src="https://img.icons8.com/ios/50/search--v1.png"
                             alt="Search" />
                    </button>


                    <div id="searchBar" class="search-bar">
                        <input type="text" id="searchInput" placeholder="Search..." />
                        <button id="closeSearch" type="button" onclick="closeSearch()">
                            ×
                        </button>
                    </div>
                </div>

                <!--notifications-->
                <button class="notification-button" onclick="openInvitations()">
                    ✉
                </button>

                <div class="menu-container">
                    <button class="menu-button" onclick="toggleMenu()" type="button">
                        ☰
                    </button>

                    <div id="menuOptions" class="menu-options">
                        <button type="button" onclick="goToCreateEvent()"> Create Event</button>
                        <button type="button" onclick="joinEvent()"> Join Event</button>
                        <button type="button" onclick="addFriends()"> Add Friends</button>
                        <button type="button" onclick="settings()">Settings</button>
                    </div>
                </div>
            </div>

        </div>
        
        <div class="event-section">
            <div class="event-header">
                <h2>My Events</h2>
                <button class="create-event-button" onclick="goToCreateEvent()">+</button>
            </div>

            <div id="eventsList">
                <!--events will appear here-->
            </div>
        </div>

        <!--map-->
        <main>
            <div id="map"></div>
        </main>

        <!--Bottom Navigation-->
        <nav class="bottom-nav">
            <a href="HomePage.html" class="nav-item">
                <svg viewBox="0 0 24 24" class="nav-icon">
                    <path d="M3 10.5 12 3l9 7.5" />
                    <path d="M5.5 9v11h13V9" />
                    <path d="M9 20v-6h6v6" />
                </svg>
                <span class="nav-label">Home</span>
            </a>

            <button class="sos-button" onclick="SOS()">
                <span class="sos-text">SOS</span>
            </button>

            <a href="Profile.html" class="nav-item">
                <svg viewBox="0 0 24 24" class="nav-icon">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 21a8 8 0 0 1 16 0" />
                </svg>
                <span class="nav-label">Profile</span>
            </a>
        </nav>
        <!--sos popup-->
        <div id="sosPopup" class="sos-popup">
            <div class="sos-content">
                <h2>Emergency Assistance</h2>
                <p>Are you sure you need emergency assistance?</p>
                <h1 id="countdown">5</h1>
                <button onclick="cancelSOS()">Cancel</button>
                <button onclick="call911()">Call 911</button>
            </div>
        </div>

    </div>

    <!--leaflet javascript-->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="JavaScript.js" defer></script>

</body>
</html>
