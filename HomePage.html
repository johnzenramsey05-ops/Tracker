<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>My App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style1.css" />
    <!--Leaflet css-->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="JavaScript.js" defer></script>
</head>

<body>

    <div class="app">
        <div class="search-wrapper">
            <!--<h2> My location</h2>-->
            <button id="searchButton"
                    class="search-button"
                    type="button"
                    onclick="openSearch()"
                    aria-label="Open Search">
                ⌕
            </button>
        
        <div id="search-container" class="search-container">
            <input type="text"
                   id="searchInput"
                   placeholder="Search..." />

            <button class="close-search"
                    type="button"
                    onclick="closeSearch()"
                    aria-label="Close Search">
                ✕
            </button>
            <div class="sos-wrapper">
                <!--sos button-->
                <button class="sos-button" 
                        type="button"
                        onclick="sendSOS()"
                        aria-label="Send SOS">
                    SOS
                </button>
            </div>
         </div>
    </div>

        <main>

            <div id="map"></div>
            <button class="primary-butoon" onclick="getLocation()">
                My Location
            </button>

            <p id="locationMessage"></p>

        </main>

        <!--Bottom Navigation-->
        <nav class="bottom-nav">
            <a href="HomePage.html">⌂<span>Home</span></a>
            <a href="Profile.html">♙<span>Profile</span></a>
        </nav>

    </div>

    <!--leaflet javascript-->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></script>
    <script src="JavaScript.js"></script>
    

</body>
</html>
